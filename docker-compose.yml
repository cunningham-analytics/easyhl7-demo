services:
  postgres:
    image: postgres:17
    container_name: easyhl7-demo-postgres
    environment:
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: dbt
      POSTGRES_DB: demo
    ports:
      - "5433:5432"
    volumes:
      - easyhl7_postgres_data:/var/lib/postgresql/data

volumes:
  easyhl7_postgres_data: